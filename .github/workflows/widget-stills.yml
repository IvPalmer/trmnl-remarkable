name: Widget stills
on:
  push:
    branches: ['codex/groa-576-tablet-widgets']
  pull_request:
    paths: ['app/ui/**', 'tests/render_widgets.py', '.github/workflows/widget-stills.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install offscreen Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
          pip install PySide6==6.8.0.2
      - name: Render real QML with synthetic fixtures
        run: python tests/render_widgets.py --output "$RUNNER_TEMP/widget-stills"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-stills
          path: ${{ runner.temp }}/widget-stills
          if-no-files-found: error
